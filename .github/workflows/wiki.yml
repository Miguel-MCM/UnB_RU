name: Wiki

on:
  push:
    branches: [ sprint2 ]
    paths: [ "wiki/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Publica a pasta wiki/ na Wiki do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp wiki/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "A Wiki já está igual à pasta wiki/."
          else
            git commit -m "Atualiza a Wiki com a pasta wiki/ da ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
            git push
          fi
